name: Build NP2 Kernel

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo'
        required: false
        type: string
        default: 'https://github.com/LineageOS/android_kernel_nothing_sm8475.git'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        type: string
        default: 'lineage-23.2'
      kernel_defconfig:
        description: 'Defconfig(s), space-separated. Use /name if it is in the kernel root; otherwise arch/arm64/configs/name is used.'
        required: false
        type: string
        default: 'gki_defconfig'
      extra_configs:
        description: 'Extra config fragments (space-separated, start with / if it is in the kernel root)'
        required: false
        type: string
        default: 'vendor/waipio_GKI.config vendor/nothing/waipio_GKI.config vendor/debugfs.config'
      kpm_support:
        description: 'Enable KPM support'
        required: false
        type: boolean
        default: true
      susfs_support:
        description: 'Enable SUSFS support'
        required: false
        type: boolean
        default: true
      susfs_branch:
        description: 'SUSFS branch (also selects patch name)'
        required: false
        type: string
        default: 'gki-android13-5.10'
      extra_patches_dir:
        description: 'Extra patch directory (repo-local). Default is the LineageOS-only 5.10.269 backport; clear it for any other kernel_repo/kernel_branch'
        required: false
        type: string
        default: 'patches/lineage-lts'
      bbg_support:
        description: 'Enable BBG support'
        required: false
        type: boolean
        default: true
      susfs_force:
        description: 'Force SUSFS patch apply (ignore failures)'
        required: false
        type: boolean
        default: false
      droidspaces_support:
        description: 'Enable Droidspaces-OSS support (GKI 5.10 kABI patches + container configs)'
        required: false
        type: boolean
        default: false
      rcu_lazy:
        description: 'Enable lazy RCU (patches/rcu-lazy, CONFIG_RCU_LAZY, rcu_nocbs=0-7)'
        required: false
        type: boolean
        default: true
      kernel_type:
        description: 'Kernel type identifier (arter97, NothingOSS, LineageOS)'
        required: false
        type: string
        default: 'LineageOS'

  workflow_call:
    inputs:
      kernel_repo:
        required: false
        type: string
        default: 'https://github.com/LineageOS/android_kernel_nothing_sm8475.git'
      kernel_branch:
        required: false
        type: string
        default: 'lineage-23.2'
      kernel_defconfig:
        description: 'Defconfig(s), space-separated. Use /name if it is in the kernel root; otherwise arch/arm64/configs/name is used.'
        required: false
        type: string
        default: 'gki_defconfig'
      extra_configs:
        required: false
        type: string
        default: 'vendor/waipio_GKI.config vendor/nothing/waipio_GKI.config vendor/debugfs.config'
      kpm_support:
        required: false
        type: boolean
        default: false
      susfs_support:
        required: false
        type: boolean
        default: true
      susfs_branch:
        required: false
        type: string
        default: 'gki-android13-5.10'
      extra_patches_dir:
        required: false
        type: string
        default: ''
      bbg_support:
        required: false
        type: boolean
        default: false
      susfs_force:
        required: false
        type: boolean
        default: false
      droidspaces_support:
        required: false
        type: boolean
        default: false
      rcu_lazy:
        required: false
        type: boolean
        default: true
      kernel_type:
        required: false
        type: string
        default: 'LineageOS'
      skip_release:
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      build_date: ${{ steps.date.outputs.build_date }}
      manager: ${{ steps.manager.outputs.manager }}
    env:
      KERNEL_DIR: kernel
      ANYKERNEL_DIR: AnyKernel3
      DEFCONFIG: ${{ inputs.kernel_defconfig }}
      DEFCONFIG_FRAGS: ${{ inputs.extra_configs }}
      # CCACHE_DIR is set in the "Configure ccache" step to an absolute path;
      # a literal ~ in this env block is NOT expanded and breaks the cache.
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: time_macros,include_file_mtime
      CCACHE_PATH: /usr/bin
      # KSU_VERSION is pinned here on purpose. SukiSU's kernel/Makefile derives it at
      # build time from a live `api.github.com/.../commits?sha=main` count, so the SHA
      # pin does NOT control it: builds reported 40922 (main's count) while the manager
      # app reports 40900, producing "manager version and kernelsu driver version
      # mismatch!" on device. This value must equal the version code of MGR_TAG in
      # the "Check manager alignment" step.
      MAKE_ARGS: >-
        ARCH=arm64
        CROSS_COMPILE=aarch64-linux-gnu-
        CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        LLVM=1 LLVM_IAS=1
        LD=ld.lld HOSTLD=ld.lld
        CC=clang CXX=clang++
        HOSTCC=clang HOSTCXX=clang++
        KSU_VERSION=40900
        O=out

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set build date
        # Colon-free ISO 8601 (UTC) — colons are invalid in filenames on FAT/exFAT/NTFS
        id: date
        run: |
          d=$(date -u +'%Y-%m-%dT%H-%M-%SZ')
          echo "BUILD_DATE=$d" >> "$GITHUB_ENV"
          echo "build_date=$d" >> "$GITHUB_OUTPUT"

      - name: Configure ccache
        run: |
          mkdir -p "$HOME/.ccache"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev ccache \
            lz4 zip python3 clang llvm lld gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi wget

      - name: Setup ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ inputs.kernel_type || 'LineageOS' }}-${{ hashFiles('Scripts/build_kernel.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.kernel_type || 'LineageOS' }}-
            ccache-${{ runner.os }}-

      - name: Wire ccache shims into PATH
        run: |
          mkdir -p ~/.local/ccache-shims
          for tool in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$tool" > ~/.local/ccache-shims/$tool
            chmod +x ~/.local/ccache-shims/$tool
          done
          cp ~/.local/ccache-shims/clang ~/.local/ccache-shims/clang-18
          echo "$HOME/.local/ccache-shims" >> "$GITHUB_PATH"

      - name: Setup LLVM toolchain path (arter97 compat)
        if: ${{ contains(inputs.kernel_repo || '', 'arter97/android_kernel_nothing_sm8475') }}
        run: |
          llvm_dir=/home/arter97/android/nathan/llvm-22.1.0-x86_64/bin
          sudo mkdir -p "$llvm_dir"
          for tool in clang clang++ llvm-ar llvm-nm llvm-objdump llvm-objcopy llvm-readelf llvm-strip ld.lld; do
            src=$(command -v "$tool" || true)
            if [ -n "$src" ]; then
              sudo ln -sf "$src" "$llvm_dir/$tool"
            fi
          done

      - name: Clone sources
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch || 'lineage-23.2' }}" \
            "${{ inputs.kernel_repo || 'https://github.com/LineageOS/android_kernel_nothing_sm8475.git' }}" \
            "$KERNEL_DIR"

          # Pinned: AnyKernel3 @ af770f7b16cf (2026-08-22) — last commit before the
          # magiskboot v31.0 *beta* tools bump. Upstream ships no tags, so a SHA is the
          # only pin available; full clone because a shallow one cannot check out non-tip.
          git clone https://github.com/osm0sis/AnyKernel3.git "$ANYKERNEL_DIR"
          git -C "$ANYKERNEL_DIR" checkout af770f7b16cf8f8eb7c68614b2a693b3b361c90c
          rm -rf "$ANYKERNEL_DIR/.git"

      - name: Clone SUSFS
        if: ${{ inputs.susfs_support == true }}
        run: |
          # Pinned: SUSFS v2.3.0 @ 14c45388ec8c (2026-10-12). The branch carries no
          # current tag (only 1.4.2-gki-android13-5.10 from 2024), so the SHA is the pin.
          # Full clone, not --depth=1: a shallow clone cannot check out a non-tip commit.
          #
          # Paired with the SukiSU `builtin` pin below: the kernel-side patch calls ksu_*
          # symbols (e.g. ksu_handle_post_execveat_sucompat) that only a matching builtin
          # tree defines. Bump both pins together, or the link fails as run 35168531820 did:
          #   ld.lld: error: undefined symbol: ksu_install_su_fd
          branch="${{ inputs.susfs_branch || 'gki-android13-5.10' }}"
          git clone -b "$branch" https://gitlab.com/simonpunk/susfs4ksu.git
          if [ "$branch" = "gki-android13-5.10" ]; then
            git -C susfs4ksu checkout 14c45388ec8cb3ca72f2ac8bf83097b9285a8418
          else
            echo "Non-default SUSFS branch '$branch' — no pin available, tracking tip"
          fi

      - name: Setup SukiSU-Ultra
        run: |
          cd "$KERNEL_DIR"
          # Pinned: SukiSU-Ultra `builtin` branch @ 6c284e957fea (2026-10-09).
          # Deliberately NOT a release tag. v4.2.0, main and dev declare no KSU_SUSFS
          # symbol at all, so `CONFIG_KSU_SUSFS=y` was silently dropped by olddefconfig
          # and SUSFS compiled out of every build. `builtin` is the SUSFS-integrated
          # variant (KSU_SUSFS + 9 sub-options, all default y) and still consumes
          # fs/susfs.c + include/linux/susfs.h from the susfs4ksu patch below.
          # setup.sh is fetched at the same commit; it swallows a failed checkout
          # ("git checkout ... || echo"), so the ref is verified afterwards.
          SUKISU_REV=6c284e957feaa9a388a9f1c37dc4ec80d95e434b
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SUKISU_REV}/kernel/setup.sh" | bash -s "$SUKISU_REV"
          test "$(git -C KernelSU rev-parse HEAD)" = "$SUKISU_REV"

      - name: Check manager alignment
        id: manager
        env:
          GH_TOKEN: ${{ github.token }}
          MGR_TAG: v4.2.0
        run: |
          rel=$(gh api "repos/SukiSU-Ultra/SukiSU-Ultra/releases/tags/$MGR_TAG")
          tag=$(jq -r .tag_name <<<"$rel")
          mgr_code=$(jq -r '.assets[].name' <<<"$rel" | sed -nE 's/^SukiSU_v[0-9.]+_([0-9]+)-release\.apk$/\1/p')
          mgr_hdr=$(gh api -H 'Accept: application/vnd.github.raw' "repos/SukiSU-Ultra/SukiSU-Ultra/contents/uapi/supercall.h?ref=$tag")
          mgr_uapi=$(sed -nE 's/.*KERNEL_SU_UAPI_VERSION[^0-9]+([0-9]+).*/\1/p' <<<"$mgr_hdr")
          drv_code=$(sed -nE 's/.*KSU_VERSION=([0-9]+).*/\1/p' <<<"$MAKE_ARGS")
          drv_uapi=$(sed -nE 's/.*KERNEL_SU_UAPI_VERSION[^0-9]+([0-9]+).*/\1/p' "$KERNEL_DIR/KernelSU/kernel/include/uapi/supercall.h")
          echo "Pinned manager $tag: version ${mgr_code:-?}, uapi ${mgr_uapi:-?}"
          echo "Driver: version ${drv_code:-?}, uapi ${drv_uapi:-?}"
          if [ -z "$mgr_code" ] || [ "$mgr_code" != "$drv_code" ] || [ -z "$mgr_uapi" ] || [ "$mgr_uapi" != "$drv_uapi" ]; then
            echo "::error::Driver does not match pinned manager $tag. Set KSU_VERSION in MAKE_ARGS to its version code and pin a SukiSU builtin revision with the same uapi version (SPEC V6)."
            exit 1
          fi
          latest=$(gh api repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest --jq .tag_name)
          if [ "$latest" != "$tag" ]; then
            echo "::warning::SukiSU-Ultra $latest is out; this build still targets manager $tag. Bump MGR_TAG, KSU_VERSION and the builtin pin together once builtin's uapi version matches $latest (SPEC V6)."
          fi
          echo "manager=$tag ($mgr_code)" >> "$GITHUB_OUTPUT"

      - name: Apply extra patches
        if: ${{ inputs.extra_patches_dir != '' }}
        run: |
          patch_dir="$GITHUB_WORKSPACE/${{ inputs.extra_patches_dir }}"
          if [ ! -d "$patch_dir" ]; then
            echo "Extra patches dir not found: $patch_dir" >&2
            exit 1
          fi
          cd "$KERNEL_DIR"
          while IFS= read -r -d '' patch; do
            base=$(sed -n '/^diff /q; s/^Base:.* @ \([0-9a-f]\{40\}\).*/\1/p' "$patch")
            if [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$patch was generated against $base but the clone is at $(git rev-parse HEAD). Regenerate it (SPEC §L3) or clear extra_patches_dir."
              exit 1
            fi
            echo "Applying $patch"
            patch -p1 < "$patch"
          done < <(find "$patch_dir" -maxdepth 1 -type f \( -name '*.patch' -o -name '*.diff' \) -print0 | sort -z)

      - name: Apply performance patches
        if: ${{ !contains(inputs.kernel_repo || '', 'arter97/android_kernel_nothing_sm8475') }}
        run: |
          dirs=(lz4)
          if [ "${{ inputs.rcu_lazy }}" = "true" ]; then dirs+=(rcu-lazy); fi
          cd "$KERNEL_DIR"
          for d in "${dirs[@]}"; do
            for patch in "$GITHUB_WORKSPACE/patches/$d"/*.patch; do
              echo "Applying $patch"
              patch -p1 < "$patch"
            done
          done

      - name: Apply SUSFS patches
        if: ${{ inputs.susfs_support == true }}
        run: |
          cd "$KERNEL_DIR"
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          susfs_patch="../susfs4ksu/kernel_patches/50_add_susfs_in_${{ inputs.susfs_branch || 'gki-android13-5.10' }}.patch"
          if [ "${{ inputs.susfs_force }}" = "true" ]; then
            patch -p1 --force < "$susfs_patch" || echo "Continuing despite patch failure"
          else
            patch -p1 < "$susfs_patch"
          fi

      - name: Apply BBG patches
        if: ${{ inputs.bbg_support == true }}
        run: |
          cd "$KERNEL_DIR"
          # Pinned: v1.1 = d4f7302190b8 (2025-12-24), the latest tagged release; setup.sh
          # fetched at that same commit. The ref is passed as a TAG, not a SHA: setup.sh
          # clones with `git clone --branch "$ref"`, which resolves tags/branches only.
          BBG_TAG=v1.1
          BBG_REV=d4f7302190b83246266598eb5d59c6b36fa22bdc
          wget -O- "https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/${BBG_REV}/setup.sh" | bash -s "$BBG_TAG"
          test "$(git -C Baseband-guard rev-parse HEAD)" = "$BBG_REV"
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: Apply Droidspaces patches
        if: ${{ inputs.droidspaces_support == true }}
        run: |
          # GKI 5.10 kABI fix: SYSVIPC variant 6_7_8 (task_struct reserved slots 6-8 are
          # free on LineageOS sm8475; slot 1 is used by pf_io_worker so 1_2_3 would bootloop)
          # plus the POSIX_MQUEUE padding fix mandatory for kernels <= 5.10.
          # Vendored from ravindu644/Droidspaces-OSS @ 4106757e0f72 (2026-04-22, still
          # current as of upstream release v6.6.0) — verified identical to upstream.
          patch_dir="$GITHUB_WORKSPACE/patches/droidspaces"
          if [ ! -d "$patch_dir" ]; then
            echo "Droidspaces patches dir not found: $patch_dir" >&2
            exit 1
          fi
          cd "$KERNEL_DIR"
          while IFS= read -r -d '' patch; do
            echo "Applying $patch"
            patch -p1 < "$patch"
          done < <(find "$patch_dir" -maxdepth 1 -type f -name '*.patch' -print0 | sort -z)

      - name: Prepare build scripts
        run: |
          chmod +x Scripts/build_kernel.sh
          chmod +x Scripts/package_anykernel.sh

      - name: Enable swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if sudo fallocate -l 12G /swapfile; then
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile || echo "Swap not permitted on this runner"
          else
            echo "Swap file allocation failed; continuing without swap"
          fi

      - name: Build kernel
        run: |
          SUSFS_SUPPORT="${{ inputs.susfs_support }}" \
          KPM_SUPPORT="${{ inputs.kpm_support }}" \
          BBG_SUPPORT="${{ inputs.bbg_support }}" \
          DROIDSPACES_SUPPORT="${{ inputs.droidspaces_support }}" \
          RCU_LAZY_SUPPORT="${{ inputs.rcu_lazy && !contains(inputs.kernel_repo || '', 'arter97/android_kernel_nothing_sm8475') }}" \
          Scripts/build_kernel.sh

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Package AnyKernel3
        run: |
          KERNEL_TYPE="${{ inputs.kernel_type || 'LineageOS' }}" \
          BUILD_DATE="${{ env.BUILD_DATE }}" \
          Scripts/package_anykernel.sh

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-${{ inputs.kernel_type || 'LineageOS' }}-NP2-SukiSU-Ultra-${{ env.BUILD_DATE }}
          path: "kernel-${{ inputs.kernel_type || 'LineageOS' }}-NP2-SukiSU-Ultra-${{ env.BUILD_DATE }}.zip"
          retention-days: 30

      - name: Upload .config for debugging
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-NP2-SukiSU-Ultra
          path: kernel/out/.config
          retention-days: 1

      - name: Collect .rej files
        if: always()
        id: collect_rej
        run: |
          mkdir -p rej
          found="false"
          while IFS= read -r -d '' f; do
            found="true"
            mkdir -p "rej/$(dirname "$f")"
            cp "$f" "rej/$f"
            orig="${f%.rej}"
            [ -f "$orig" ] && cp "$orig" "rej/$orig"
          done < <(find . -name '*.rej' -print0)
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Upload .rej files
        if: always() && steps.collect_rej.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rej-NP2-SukiSU-Ultra
          path: rej/

  release:
    needs: build
    # Under workflow_call, github.event_name is the caller's event, so it cannot tell a direct dispatch from build-all.yml.
    if: ${{ !inputs.skip_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ZIP: kernel-${{ inputs.kernel_type || 'LineageOS' }}-NP2-SukiSU-Ultra-${{ needs.build.outputs.build_date }}
    steps:
      - name: Download kernel zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ZIP }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "${{ inputs.kernel_type || 'LineageOS' }}-${{ github.run_number }}"
          name: "NP2 Kernel – ${{ inputs.kernel_type || 'LineageOS' }} #${{ github.run_number }}"
          body: |
            **Kernel type:** ${{ inputs.kernel_type || 'LineageOS' }}
            **Branch:** ${{ inputs.kernel_branch || 'lineage-23.2' }}
            **KPM:** ${{ inputs.kpm_support }}  **SUSFS:** ${{ inputs.susfs_support }}  **BBG:** ${{ inputs.bbg_support }}  **Droidspaces:** ${{ inputs.droidspaces_support }}  **Lazy RCU:** ${{ inputs.rcu_lazy && !contains(inputs.kernel_repo || '', 'arter97/android_kernel_nothing_sm8475') }}
            **Manager:** SukiSU-Ultra ${{ needs.build.outputs.manager }} — install exactly this manager version. A newer manager may not work with this kernel.
          files: "${{ env.ZIP }}.zip"
          draft: false
          prerelease: false
